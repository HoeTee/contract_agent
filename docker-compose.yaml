services:
  deep-research-agent:
    image: southernbanker/lexora:latest
    container_name: lexora
    restart: unless-stopped

    env_file:
      - .env

    command: ["python", "-m", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    
    ports:
      - "0.0.0.0:5000:8000"
    
    cpus: "4"
    mem_limit: 8g
    mem_reservation: 4g

    volumes: 
      - ./.env:/app/.env:ro
      - ./users.json:/app/users.json:ro
      - ./data:/app/data

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

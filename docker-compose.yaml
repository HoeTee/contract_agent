services:
  deep-research-agent:
    image: deep-research-agent:latest
    container_name: deep-research-agent
    restart: unless-stopped

    env_file:
      - .env
    
    ports:
      - "127.0.0.1:8000:5000"
    
    cpus: "4"
    mem_limit: 8g
    mem_reservation: 4g

    volumes: 
      - ./.env:/app/.env:ro
      - ./users.json:/app/users.json:ro
      - ./data:/app/data

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

llm:
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  name: "qwen3.6-27b"
  enable_thinking: false
  max_context_tokens: 254000
  max_result_tokens: 64000
  max_tool_calls: 25
  temperature: 0.0
  top_p: 0.01
  seed: 42

embedding:
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  name: "text-embedding-v4"

rerank:
  base_url: "http://127.0.0.1:8000/v1"
  endpoint_format: "openai"
  name: "qwen3-rerank"
  inject_instruct: true

workflow:
  max_reflection_rounds: 5
  max_orchestrator_concurrency: 100
  max_api_concurrent_reviews: 1
  model_call_timeout_seconds: 60
  model_call_max_retries: 5

retrieval:
  chunk_size: 512
  chunk_overlap: 100
  similarity_top_k: 10
  rerank_top_n: 5

api:
  keep_input: true
  write_logs: true
  meta_required: false
  meta_fields:
    - "templateCode"
    - "serialNo"
  callback_enabled: false
  callback_url: ""
  callback_file_field: "file"

docx:
  comment_include_criterion: false

logging:
  enable_workflow_logs: false
